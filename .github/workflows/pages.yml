name: Publish site

# Pages for this repository is configured to serve the `gh-pages` branch, so
# publishing is a matter of mirroring `main` onto it. Pushing to `gh-pages`
# triggers GitHub's own "pages build and deployment" run, which serves the
# files as-is (there is no build step, and .nojekyll disables Jekyll).
#
# This deliberately does not use actions/deploy-pages: the `github-pages`
# environment only accepts deployments from the branch Pages is configured to
# serve, so an Actions-based deploy from `main` is rejected before it starts.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror main onto gh-pages
        run: git push --force origin HEAD:refs/heads/gh-pages
